name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies and generate Android
        run: |
          npm install
          npx cap add android || true
          npx cap sync android

      - name: Replace Android System Icons
        run: |
          if [ -f www/icon.png ]; then
            echo "Обновляем системные иконки Android..."
            sudo apt-get install -y imagemagick
            for res in "mipmap-mdpi/48x48" "mipmap-hdpi/72x72" "mipmap-xhdpi/96x96" "mipmap-xxhdpi/144x144" "mipmap-xxxhdpi/192x192"; do
              dir="android/app/src/main/res/${res%/*}"
              size="${res#*/}"
              mkdir -p "$dir"
              convert www/icon.png -resize "$size" "$dir/ic_launcher.png"
              convert www/icon.png -resize "$size" "$dir/ic_launcher_round.png"
              convert www/icon.png -resize "$size" "$dir/ic_launcher_foreground.png"
            done
          fi

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finny-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
