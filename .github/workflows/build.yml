name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies and sync Capacitor
        run: |
          npm install
          npx cap add android || true
          npx cap sync android

      - name: Copy App Icon to Android Mipmap Folders
        run: |
          if [ -f www/icon.png ]; then
            echo "Копируем иконку в системные ресурсы Android..."
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp www/icon.png "$dir/ic_launcher.png"
                cp www/icon.png "$dir/ic_launcher_round.png"
                cp www/icon.png "$dir/ic_launcher_foreground.png"
              fi
            done
          fi

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finny-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
