name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          npm install
          npx cap add android || true

      - name: Generate App Icons via Python
        run: |
          python3 -c "
          import os
          from PIL import Image

          src_icon = 'www/icon.png'
          if os.path.exists(src_icon):
              img = Image.open(src_icon).convert('RGBA')
              sizes = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192
              }
              base_res = 'android/app/src/main/res'
              for folder, size in sizes.items():
                  target_dir = os.path.join(base_res, folder)
                  os.makedirs(target_dir, exist_ok=True)
                  resized = img.resize((size, size), Image.Resampling.LANCZOS)
                  resized.save(os.path.join(target_dir, 'ic_launcher.png'))
                  resized.save(os.path.join(target_dir, 'ic_launcher_round.png'))
                  
                  # Адаптивный передний план (foreground)
                  fg_size = int(size * 1.5)
                  fg = img.resize((fg_size, fg_size), Image.Resampling.LANCZOS)
                  fg.save(os.path.join(target_dir, 'ic_launcher_foreground.png'))
              print('Иконки успешно сгенерированы во все папки mipmap!')
          else:
              print('Файл www/icon.png не найден, пропуск.')
          "

      - name: Sync Android
        run: |
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finny-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
