name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          npm install
          npx cap add android || true

      - name: Generate App Icons
        run: |
          if [ -f "www/icon.png" ]; then
            echo "Файл www/icon.png найден. Генерируем иконки..."
            declare -A SIZES=( ["mipmap-mdpi"]=48 ["mipmap-hdpi"]=72 ["mipmap-xhdpi"]=96 ["mipmap-xxhdpi"]=144 ["mipmap-xxxhdpi"]=192 )
            BASE_RES="android/app/src/main/res"
            for FOLDER in "${!SIZES[@]}"; do
              SIZE=${SIZES[$FOLDER]}
              DIR="$BASE_RES/$FOLDER"
              mkdir -p "$DIR"
              convert www/icon.png -resize "${SIZE}x${SIZE}" "$DIR/ic_launcher.png" || cp www/icon.png "$DIR/ic_launcher.png"
              convert www/icon.png -resize "${SIZE}x${SIZE}" "$DIR/ic_launcher_round.png" || cp www/icon.png "$DIR/ic_launcher_round.png"
              convert www/icon.png -resize "${SIZE}x${SIZE}" "$DIR/ic_launcher_foreground.png" || cp www/icon.png "$DIR/ic_launcher_foreground.png"
            done
            echo "Иконки успешно сгенерированы!"
          else
            echo "Файл www/icon.png не найден, пропуск."
          fi

      - name: Sync Android
        run: |
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finny-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
