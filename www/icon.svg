<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Градиент фона приложения -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    
    <!-- Градиент золотой монеты -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Тень -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064E3B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Закругленная подложка иконки (512x512) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Группа персонажа с тенью -->
  <g filter="url(#shadow)">
    <!-- Ушки тигрёнка -->
    <circle cx="160" cy="180" r="46" fill="#F97316" />
    <circle cx="160" cy="180" r="28" fill="#FDBA74" />
    <circle cx="352" cy="180" r="46" fill="#F97316" />
    <circle cx="352" cy="180" r="28" fill="#FDBA74" />

    <!-- Голова -->
    <circle cx="256" cy="260" r="130" fill="#FB923C" />

    <!-- Полоски тигра -->
    <path d="M 256 135 L 244 175 L 268 175 Z" fill="#7C2D12" />
    <path d="M 145 240 L 180 248 L 150 262 Z" fill="#7C2D12" />
    <path d="M 367 240 L 332 248 L 362 262 Z" fill="#7C2D12" />

    <!-- Белая мордочка -->
    <ellipse cx="256" cy="295" rx="75" ry="55" fill="#FFFFFF" />

    <!-- Глазки -->
    <circle cx="205" cy="245" r="15" fill="#1E293B" />
    <circle cx="210" cy="240" r="5" fill="#FFFFFF" />
    <circle cx="307" cy="245" r="15" fill="#1E293B" />
    <circle cx="312" cy="240" r="5" fill="#FFFFFF" />

    <!-- Носик и улыбка -->
    <polygon points="256,280 245,268 267,268" fill="#EA580C" />
    <path d="M 245 288 Q 256 298 267 288" fill="none" stroke="#7C2D12" stroke-width="4" stroke-linecap="round" />
    
    <!-- Язычок -->
    <path d="M 250 293 Q 256 308 262 293 Z" fill="#F43F5E" />
  </g>

  <!-- Золотая монетка в лапке -->
  <g filter="url(#shadow)">
    <circle cx="360" cy="360" r="62" fill="url(#coinGrad)" stroke="#CA8A04" stroke-width="6" />
    <circle cx="360" cy="360" r="48" fill="none" stroke="#FEF08A" stroke-width="3" stroke-dasharray="6,4" />
    <text x="360" y="378" font-size="52" font-family="-apple-system, Arial, sans-serif" font-weight="900" fill="#854D0E" text-anchor="middle">₽</text>
  </g>

  <!-- Декоративные искорки -->
  <path d="M 120 120 Q 130 130 140 130 Q 130 130 120 140 Q 110 130 100 130 Q 110 130 120 120 Z" fill="#FDE047" />
  <circle cx="410" cy="140" r="8" fill="#FDE047" />
</svg>
